# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8bac258ab3fa3ab35a32acabd2b1919b"
name = "merchgrid-catalog-audit"
application_url = "https://merchgrid-catalog-audit.fly.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # GDPR / mandatory compliance webhooks are NOT regular subscriptions.
  # They are declared here; all three point at the same /webhooks/compliance route,
  # which switches on the topic (CUSTOMERS_DATA_REQUEST / CUSTOMERS_REDACT / SHOP_REDACT).
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/compliance"
  customer_deletion_url = "/webhooks/compliance"
  shop_deletion_url = "/webhooks/compliance"

[auth]
redirect_urls = [ "https://merchgrid-catalog-audit.fly.dev/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
